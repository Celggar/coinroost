# Words a bank description uses to name the fortnight a salary payment is for, such as "II Qna de Septiembre 2025"
# or "Q1 Febrero". Matched on the description with accents, case and punctuation dropped.

# A half word, then any number of joiners, then a month word, then optionally a year (with a year joiner before it).
joiners = ["qna", "quincena", "de", "del"]
year_joiners = ["de", "del"]

[halves]
primera = 1
1era = 1
1ra = 1
q1 = 1
i = 1
segunda = 2
2da = 2
q2 = 2
ii = 2

