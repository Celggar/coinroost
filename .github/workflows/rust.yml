name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # The server tests create one database per test on this throwaway server.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: coinroost
          POSTGRES_PASSWORD: coinroost
          POSTGRES_DB: coinroost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coinroost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://coinroost:coinroost@localhost:5432/coinroost
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version, components and targets; rustup installs them on first use.
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Normalizer builds for iOS and the web
        run: |
          cargo check -p coinroost-normalizer --target aarch64-apple-ios --locked
          cargo check -p coinroost-normalizer --target wasm32-unknown-unknown --locked
