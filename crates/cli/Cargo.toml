[package]
name = "coinroost-cli"
description = "Command-line access to the Coinroost normalizer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "coinroost"
path = "src/main.rs"

[dependencies]
coinroost-normalizer = { path = "../normalizer" }
coinroost-rules = { path = "../rules" }
coinroost-payroll = { path = "../payroll" }
coinroost-transfers = { path = "../transfers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false }

[lints]
workspace = true
