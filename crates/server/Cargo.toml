[package]
name = "coinroost-server"
description = "The Coinroost API server: accounts, transactions, imports and their rules, on PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "coinroost-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.22"
coinroost-normalizer = { path = "../normalizer" }
coinroost-payroll = { path = "../payroll" }
coinroost-rules = { path = "../rules" }
coinroost-transfers = { path = "../transfers" }
iso_currency = "0.7.1"
rand = "0.10.3"
# The MCP SDK, pinned: releases come weekly and a new one waits a week before it is taken.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rpassword = "7.5.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "macros", "migrate", "uuid", "time", "json"] }
time = { version = "0.3.55", features = ["serde-human-readable", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "time", "preserve_order"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
