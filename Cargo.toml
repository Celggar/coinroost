[workspace]
resolver = "3"
members = ["crates/normalizer", "crates/rules", "crates/transfers", "crates/payroll", "crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Celggar/coinroost"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Password and recovery-code hashing is costly by design (Argon2id at 19 MiB); unoptimized it slows every test that
# logs in. Optimizing just these crates keeps the rest of a debug build quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
